<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102d53"><title>我的頭痛紀錄 V1.1</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#182b42;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#102d53;color:white;padding:18px 16px 13px;position:sticky;top:0;z-index:3}h1{font-size:21px;margin:0}small,.muted{color:#65768a}header small{color:#c6d9ec}.wrap{max-width:650px;margin:auto;padding:14px 12px 95px}.card{background:white;border-radius:15px;padding:15px;margin-bottom:13px;box-shadow:0 2px 12px #1b3d6010}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:15px 0 8px}.flex{display:flex;align-items:center;justify-content:space-between;gap:10px}.btn{border:1px solid #ccd8e5;background:white;border-radius:11px;padding:11px 13px;font-size:15px;color:#193a60;cursor:pointer}.primary{background:#165a9d;color:white;border-color:#165a9d}.danger{color:#b42318;border-color:#e8b9b5}.mini{padding:7px 10px;font-size:13px}.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.weekday{text-align:center;background:#17385f;color:white;padding:10px 0;border-radius:5px;font-weight:600}.day{position:relative;min-height:59px;border:1px solid #d6e0eb;border-radius:7px;background:white;text-align:left;padding:6px;font-size:16px;color:#253a51;cursor:pointer}.day.out{background:transparent;border:0}.day.today{background:#fff8dd}.day.visit{border:3px solid #dc3232;padding:4px}.day .dot{position:absolute;right:7px;bottom:8px;width:13px;height:13px;background:#159447;border-radius:50%}.day .draftdot{background:#e6a128}.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:#586e82;margin-top:12px}.mark{width:13px;height:13px;border-radius:50%;background:#159447;display:inline-block;vertical-align:middle}.redbox{display:inline-block;width:14px;height:14px;border:3px solid #dc3232;vertical-align:middle}.field{margin:12px 0}.field label{display:block;font-weight:600;font-size:14px;margin-bottom:7px}input,select,textarea{width:100%;padding:12px 10px;border:1px solid #cbd8e5;border-radius:10px;font:inherit;background:white;color:#172c43}textarea{min-height:68px}.choices{display:flex;flex-wrap:wrap;gap:7px}.choice{border:1px solid #cbd8e5;border-radius:10px;background:#fff;padding:10px 12px;font-size:14px;cursor:pointer}.choice.active{background:#e1f0ff;border-color:#1465b1;color:#064a86;font-weight:700}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:9px}.separator{border:0;border-top:1px solid #e4ebf3;margin:18px 0}.entry{padding:12px 0;border-bottom:1px solid #e4ebf3}.entry:last-child{border:0}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #d9e3ee;display:flex;justify-content:center;z-index:5;padding-bottom:env(safe-area-inset-bottom)}.bottom button{flex:1;max-width:160px;border:0;background:white;padding:12px 3px;color:#5e7184;font-size:12px}.bottom button.active{color:#1262aa;font-weight:800}.stat{background:#eef5fc;border-radius:11px;padding:13px}.stat b{display:block;font-size:25px;color:#174f83}.warn{background:#fff6e6;padding:11px;border-radius:10px;font-size:13px;color:#76511d}.hidden{display:none!important}.pill{font-size:12px;background:#e8f3fe;border-radius:20px;padding:4px 9px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}canvas{max-width:100%}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8bc2ff} @media(max-width:360px){.day{min-height:50px;padding:4px}.day.visit{padding:2px}.choice{padding:9px}}
</style></head><body><header><div class="flex"><div><h1>我的頭痛紀錄</h1><small>iPhone 頭痛日誌 · V1.1</small></div><span style="font-size:24px">🧠</span></div></header><main class="wrap" id="app"><section class="card"><h2>正在開啟頭痛月曆…</h2><p>如果畫面一直停留在這裡，代表目前的 iPhone 檔案預覽器不支援此 App 所需的程式功能。請使用支援 JavaScript 的瀏覽器，並透過固定網址開啟正式網頁版。</p></section></main><nav class="bottom" id="nav"></nav><script>
'use strict';const clone=x=>JSON.parse(JSON.stringify(x));const KEY='headache_diary_v1';const defaults={records:[],visits:[],meds:[{id:'m1',name:'英明格',strength:'50',unit:'mg',active:true},{id:'m2',name:'Naposhin',strength:'250',unit:'mg',active:true},{id:'m3',name:'痛停錠 TONEC',strength:'100',unit:'mg',active:true},{id:'m4',name:'立舒定錠',strength:'1.5',unit:'mg',active:true},{id:'m5',name:'舒肉筋新錠',strength:'1',unit:'tablet',active:true}],hospitals:['臺北榮民總醫院','國泰綜合醫院'],doctors:['凌郁翔']};let db=load(),view='calendar',cursor=new Date(),editDate='',editId='',draft=null,visitEditId='',medEditId='';function load(){try{let x=JSON.parse(localStorage.getItem(KEY));return x&&Array.isArray(x.records)?{...clone(defaults),...x}:clone(defaults)}catch(e){return clone(defaults)}}function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('儲存失敗，請先匯出備份並確認瀏覽器儲存空間。');return false}}const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),dateISO=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'),today=()=>dateISO(new Date()),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8),val=id=>$(id)?.value??'',number=s=>Number(s)||0;function go(v){view=v;render()}function render(){renderNav();const a=$('app');if(view==='calendar')a.innerHTML=calendarHTML();if(view==='date')a.innerHTML=dateHTML();if(view==='edit')a.innerHTML=editHTML();if(view==='visitEdit')a.innerHTML=visitHTML();if(view==='history')a.innerHTML=historyHTML();if(view==='stats')a.innerHTML=statsHTML();if(view==='settings')a.innerHTML=settingsHTML();if(view==='medEdit')a.innerHTML=medHTML();if(view==='visitSettings')a.innerHTML=visitSettingsHTML();if(view==='stats')drawChart()}
function renderNav(){let v=view==='date'||view==='edit'||view==='visitEdit'?'calendar':view==='medEdit'||view==='visitSettings'?'settings':view;$('nav').innerHTML=[['calendar','▦','月曆'],['history','☷','歷史資料'],['stats','▥','統計分析'],['settings','⚙','管理']].map(([k,i,t])=>`<button class="${v===k?'active':''}" onclick="go('${k}')"><div style="font-size:22px">${i}</div>${t}</button>`).join('')}
function calendarHTML(){let y=cursor.getFullYear(),m=cursor.getMonth(),first=new Date(y,m,1).getDay(),total=new Date(y,m+1,0).getDate(),slots=Math.ceil((first+total)/7)*7;let out=`<section class="card"><div class="flex"><button class="btn" onclick="month(-1)">❮</button><h2 style="margin:0">${y} 年 ${m+1} 月</h2><button class="btn" onclick="month(1)">❯</button></div><div class="days" style="margin-top:15px">${['日','一','二','三','四','五','六'].map(x=>`<div class="weekday">${x}</div>`).join('')}`;for(let i=0;i<slots;i++){let d=i-first+1;if(d<1||d>total){out+='<div class="day out"></div>';continue}let iso=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,r=db.records.filter(x=>x.date===iso),v=db.visits.some(x=>x.date===iso),complete=r.every(x=>x.complete!==false);out+=`<button class="day ${v?'visit':''} ${iso===today()?'today':''}" onclick="openDate('${iso}')" aria-label="${iso}${r.length?' 有頭痛紀錄':''}${v?' 有就醫紀錄':''}">${d}${r.length?`<span class="dot ${complete?'':'draftdot'}"></span>`:''}</button>`}let current=db.records.filter(r=>r.date.startsWith(`${y}-${String(m+1).padStart(2,'0')}`));let days=new Set(current.map(x=>x.date)).size;out+=`</div><div class="legend"><span><i class="mark"></i> 頭痛紀錄</span><span><i class="redbox"></i> 就醫紀錄</span><span>🟠 待補資料</span></div></section><section class="card"><div class="flex"><div><b>本月頭痛 ${days} 天</b><div class="muted" style="font-size:13px">共 ${current.length} 筆發作紀錄</div></div><button class="btn primary" onclick="openDate('${today()}')">＋ 記錄今天</button></div></section>`;return out}
function month(n){cursor=new Date(cursor.getFullYear(),cursor.getMonth()+n,1);render()}function openDate(s){editDate=s;go('date')}function dateHTML(){let r=db.records.filter(x=>x.date===editDate),v=db.visits.filter(x=>x.date===editDate);return `<section class="card"><div class="flex"><button class="btn mini" onclick="go('calendar')">❮ 月曆</button><h2 style="margin:0">${esc(editDate)}</h2></div><h3>頭痛紀錄</h3>${r.length?r.map(x=>`<div class="entry"><div class="flex"><div><b>${esc(x.time||'未填時間')} · ${esc(x.period||'未選類型')}</b><div class="muted">${esc(x.severity||'未填程度')} · ${esc(x.location||'未填位置')}</div></div><button class="btn mini" onclick="openEdit('${esc(x.id)}')">查看／修改</button></div></div>`).join(''):'<p class="muted">這一天尚無頭痛紀錄。</p>'}<div class="actions"><button class="btn primary" onclick="openEdit('')">＋ 新增頭痛</button></div><hr class="separator"><h3>今日是否有就醫？</h3>${v.length?v.map(x=>`<div class="entry"><div class="flex"><div><b>${esc(x.hospital||'未填醫院')}</b><div class="muted">${esc(x.doctor||'未填醫師')} · ${esc(x.type||'')}</div></div><button class="btn mini" onclick="openVisit('${esc(x.id)}')">修改</button></div></div>`).join(''):'<p class="muted">否（尚無就醫紀錄）</p>'}<button class="btn" onclick="openVisit('')">＋ 新增就醫紀錄</button></section>`}
const periods=['睡眠中痛醒','白天','晚上'],onsets=['悶痛','快速劇痛','其他'],locations=['左側太陽穴','右側太陽穴','雙側太陽穴','前額／頭頂','後腦','其他'],pains=['隨脈搏跳痛','持續疼痛','其他'],severities=['小痛','中痛','大痛','劇痛'],timings=['有預感時','小悶痛時','中悶痛時','開始疼痛時','其他'],reliefs=['完全止痛','部分改善','沒有改善','尚未確認'];function choice(field,items,multi=false){let x=draft[field],a=multi?(Array.isArray(x)?x:[]):[x];return `<div class="choices">${items.map(z=>`<button type="button" class="choice ${a.includes(z)?'active':''}" onclick="choose('${field}',${JSON.stringify(z).replace(/"/g,'&quot;')},${multi})">${esc(z)}</button>`).join('')}</div>`}function choose(field,item,multi){if(multi){let a=Array.isArray(draft[field])?draft[field]:[];draft[field]=a.includes(item)?a.filter(x=>x!==item):[...a,item]}else draft[field]=item;syncDraft();render()}
function openEdit(id){editId=id;let old=db.records.find(x=>x.id===id);draft=old?clone(old):{id:uid(),date:editDate,time:'',period:'',onset:'',location:[],pain:'',severity:'',nausea:'',light:'',noise:'',movement:'',vomit:'',neck:'',stress:'',notes:'',medEvents:[],complete:true};go('edit')}function syncDraft(){if(view!=='edit')return;for(let f of ['date','time','stress','notes']){let e=$('f_'+f);if(e)draft[f]=e.value}draft.medEvents.forEach((x,i)=>{for(let f of ['time','timing','relief','minutes','qtyNote']){let e=$(`ev_${i}_${f}`);if(e)x[f]=e.value}})}function chooseMed(i,id){syncDraft();let a=draft.medEvents[i].meds||[];draft.medEvents[i].meds=a.includes(id)?a.filter(x=>x!==id):[...a,id];render()}function addEvent(){syncDraft();draft.medEvents.push({id:uid(),time:'',timing:'',meds:[],relief:'尚未確認',minutes:'',qtyNote:''});render()}function removeEvent(i){if(!confirm('刪除這筆用藥紀錄？'))return;syncDraft();draft.medEvents.splice(i,1);render()}
function editHTML(){return `<section class="card"><div class="flex"><button class="btn mini" onclick="backEdit()">❮ 返回</button><h2 style="margin:0">${editId?'修改':'新增'}頭痛紀錄</h2></div><div class="field"><label>發作日期</label><input id="f_date" type="date" value="${esc(draft.date)}" onchange="draft.date=this.value"></div><div class="field"><label>發作時間</label><input id="f_time" type="time" value="${esc(draft.time)}" onchange="draft.time=this.value"></div>${section('發作時段',choice('period',periods))}${section('疼痛開始性質',choice('onset',onsets))}${draft.onset==='快速劇痛'?'<p class="warn">若疼痛突然發作、約 1 分鐘內達最劇烈程度，請立即就醫評估，不要只記錄為一般偏頭痛。</p>':''}${section('疼痛位置（可複選）',choice('location',locations,true))}${section('疼痛性質',choice('pain',pains))}${section('疼痛程度',choice('severity',severities))}${[['nausea','是否噁心'],['light','是否怕光'],['noise','是否怕噪音'],['movement','是否隨身體震動加重'],['vomit','是否嘔吐'],['neck','是否頸部僵硬']].map(([k,t])=>section(t,choice(k,['是','否']))).join('')}<div class="field"><label>當天工作壓力（0～10 分，可不填）</label><select id="f_stress" onchange="draft.stress=this.value"><option value="">未記錄</option>${Array.from({length:11},(_,i)=>`<option ${String(draft.stress)===String(i)?'selected':''} value="${i}">${i}</option>`).join('')}</select></div><hr class="separator"><h3>用藥紀錄</h3><p class="muted" style="font-size:13px">可記錄第一次、第二次及更多次用藥。僅供記錄，不代表建議追加劑量。</p>${draft.medEvents.map((ev,i)=>`<div class="card" style="border:1px solid #e1e9f2;box-shadow:none;padding:12px"><div class="flex"><b>第 ${i+1} 次用藥</b><button class="btn mini danger" onclick="removeEvent(${i})">刪除</button></div><div class="field"><label>實際服藥時間</label><input type="time" id="ev_${i}_time" value="${esc(ev.time)}" onchange="draft.medEvents[${i}].time=this.value"></div><div class="field"><label>用藥時機</label><select id="ev_${i}_timing" onchange="draft.medEvents[${i}].timing=this.value"><option value="">請選擇</option>${timings.map(x=>`<option ${ev.timing===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>使用藥物（可複選；未勾選即沒有用藥）</label><div class="choices">${db.meds.filter(m=>m.active||ev.meds?.includes(m.id)).map(m=>`<button class="choice ${(ev.meds||[]).includes(m.id)?'active':''}" onclick="chooseMed(${i},'${esc(m.id)}')">${esc(m.name)} ${esc(m.strength)}${esc(m.unit)}</button>`).join('')}</div></div><div class="field"><label>實際服用數量／補充（選填）</label><input id="ev_${i}_qtyNote" placeholder="例如：各 1 錠" value="${esc(ev.qtyNote||'')}" onchange="draft.medEvents[${i}].qtyNote=this.value"></div><div class="field"><label>用藥效果</label><select id="ev_${i}_relief" onchange="draft.medEvents[${i}].relief=this.value"><option value="">請選擇</option>${reliefs.map(x=>`<option ${ev.relief===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>服藥後幾分鐘改善／止痛</label><select id="ev_${i}_minutes" onchange="draft.medEvents[${i}].minutes=this.value"><option value="">尚未記錄</option>${[5,10,15,20,30,45,60,90,120,180,240,360].map(x=>`<option value="${x}" ${String(ev.minutes)===String(x)?'selected':''}>${x} 分鐘</option>`).join('')}</select></div></div>`).join('')}<button class="btn" onclick="addEvent()">＋ 新增一次用藥</button><div class="field"><label>備註（選填）</label><textarea id="f_notes" onchange="draft.notes=this.value" placeholder="例如：清晨先脹痛，20 分鐘後轉為搏動痛">${esc(draft.notes)}</textarea></div><div class="actions"><button class="btn primary" onclick="saveRecord(true)">儲存完成</button><button class="btn" onclick="saveRecord(false)">暫存，日後補填</button>${editId?'<button class="btn danger" onclick="deleteRecord()">刪除紀錄</button>':''}</div></section>`}function section(title,html){return `<div class="field"><label>${title}</label>${html}</div>`}function backEdit(){syncDraft();if(confirm('離開此頁？尚未儲存的修改將不保留。'))go('date')}function saveRecord(complete){syncDraft();if(!draft.date){alert('請選擇日期');return}draft.complete=complete;let i=db.records.findIndex(x=>x.id===draft.id);if(i>=0)db.records[i]=structuredClone(draft);else db.records.push(structuredClone(draft));if(save()){editDate=draft.date;go('date')}}function deleteRecord(){if(!confirm('確定刪除這筆頭痛紀錄？'))return;db.records=db.records.filter(x=>x.id!==draft.id);save();go('date')}
function openVisit(id){visitEditId=id;let old=db.visits.find(x=>x.id===id);window.visitDraft=old?clone(old):{id:uid(),date:editDate,hospital:'',doctor:'',type:'門診',notes:''};go('visitEdit')}function visitHTML(){let v=window.visitDraft;return `<section class="card"><div class="flex"><button class="btn mini" onclick="go('date')">❮ 返回</button><h2 style="margin:0">${visitEditId?'修改':'新增'}就醫紀錄</h2></div><div class="field"><label>今日是否有就醫？</label><div class="choices"><button class="choice active">是</button><button class="choice" onclick="go('date')">否（返回）</button></div></div><div class="field"><label>就診日期</label><input type="date" id="v_date" value="${esc(v.date)}"></div><div class="field"><label>醫院</label><select id="v_hospital"><option value="">請選擇</option>${db.hospitals.map(x=>`<option ${v.hospital===x?'selected':''} value="${esc(x)}">${esc(x)}</option>`).join('')}</select><div class="actions"><button class="btn mini" onclick="addVisitOption('hospital')">＋ 新增醫院</button></div></div><div class="field"><label>醫師</label><select id="v_doctor"><option value="">未記錄</option>${db.doctors.map(x=>`<option ${v.doctor===x?'selected':''} value="${esc(x)}">${esc(x)}</option>`).join('')}</select><div class="actions"><button class="btn mini" onclick="addVisitOption('doctor')">＋ 新增醫師</button></div></div><div class="field"><label>就診類型</label><select id="v_type">${['門診','急診','住院','其他'].map(x=>`<option ${v.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>醫師說明／檢查／處方備註</label><textarea id="v_notes">${esc(v.notes)}</textarea></div><div class="actions"><button class="btn primary" onclick="saveVisit()">儲存就醫紀錄</button>${visitEditId?'<button class="btn danger" onclick="deleteVisit()">刪除</button>':''}</div></section>`}function addVisitOption(t){let s=prompt(t==='hospital'?'請輸入醫院名稱':'請輸入醫師姓名');if(!s?.trim())return;s=s.trim();let a=t==='hospital'?db.hospitals:db.doctors;if(!a.includes(s))a.push(s);save();let current={date:val('v_date'),hospital:val('v_hospital'),doctor:val('v_doctor'),type:val('v_type'),notes:val('v_notes')};Object.assign(window.visitDraft,current);window.visitDraft[t]=s;render()}function saveVisit(){let v=window.visitDraft;Object.assign(v,{date:val('v_date'),hospital:val('v_hospital'),doctor:val('v_doctor'),type:val('v_type'),notes:val('v_notes')});if(!v.date){alert('請選擇就診日期');return}let i=db.visits.findIndex(x=>x.id===v.id);if(i>=0)db.visits[i]=clone(v);else db.visits.push(clone(v));if(save()){editDate=v.date;go('date')}}function deleteVisit(){if(!confirm('確定刪除此就醫紀錄？'))return;db.visits=db.visits.filter(x=>x.id!==window.visitDraft.id);save();go('date')}
function historyHTML(){let records=[...db.records].sort((a,b)=>(b.date+' '+b.time).localeCompare(a.date+' '+a.time));let visits=[...db.visits].sort((a,b)=>b.date.localeCompare(a.date));return `<section class="card"><h2>歷史頭痛紀錄</h2><div class="field"><label>查詢月份</label><input type="month" id="histMonth" value="${esc(window.histMonth||'')}" onchange="window.histMonth=this.value;render()"></div><button class="btn mini" onclick="window.histMonth='';render()">顯示全部</button>${records.filter(x=>!window.histMonth||x.date.startsWith(window.histMonth)).map(x=>`<div class="entry"><div class="flex"><div><b>${esc(x.date)} ${esc(x.time)}</b><div class="muted" style="font-size:13px">${esc(x.period)} · ${esc(x.severity)} · ${x.medEvents.length} 次用藥</div></div><button class="btn mini" onclick="editDate='${esc(x.date)}';openEdit('${esc(x.id)}')">查看／修改</button></div></div>`).join('')||'<p class="muted">沒有符合條件的紀錄。</p>'}</section><section class="card"><h2>就醫歷史</h2>${visits.map(x=>`<div class="entry"><div class="flex"><div><b>${esc(x.date)} · ${esc(x.hospital)}</b><div class="muted" style="font-size:13px">${esc(x.type)} · ${esc(x.doctor)}</div></div><button class="btn mini" onclick="editDate='${esc(x.date)}';openVisit('${esc(x.id)}')">修改</button></div></div>`).join('')||'<p class="muted">尚無就醫紀錄。</p>'}</section>`}
function statsHTML(){let month=window.statMonth||today().slice(0,7),r=db.records.filter(x=>x.date.startsWith(month)),v=db.visits.filter(x=>x.date.startsWith(month)),days=new Set(r.map(x=>x.date)).size,night=r.filter(x=>x.period==='睡眠中痛醒').length,medDays=new Set(r.filter(x=>x.medEvents.some(e=>(e.meds||[]).length)).map(x=>x.date)).size,imigran=new Set(r.filter(x=>x.medEvents.some(e=>(e.meds||[]).includes('m1'))).map(x=>x.date)).size,relief=r.flatMap(x=>x.medEvents).filter(x=>x.relief==='完全止痛'&&number(x.minutes)>0),avg=relief.length?Math.round(relief.reduce((s,x)=>s+number(x.minutes),0)/relief.length):'—';let months=Array.from({length:6},(_,i)=>{let d=new Date(Number(month.slice(0,4)),Number(month.slice(5))-1-(5-i),1);return dateISO(d).slice(0,7)});return `<section class="card"><h2>頭痛統計分析</h2><div class="field"><label>分析月份</label><input type="month" value="${month}" onchange="window.statMonth=this.value;render()"></div><div class="twocol"><div class="stat"><b>${days}</b>頭痛天數</div><div class="stat"><b>${r.length}</b>發作次數</div><div class="stat"><b>${night}</b>睡眠中痛醒次數</div><div class="stat"><b>${v.length}</b>就醫次數</div><div class="stat"><b>${medDays}</b>急性用藥紀錄天數*</div><div class="stat"><b>${avg}</b>平均完全止痛分鐘</div></div><p class="muted" style="font-size:12px">*依已填的用藥紀錄計算，未必涵蓋所有實際服藥天數。</p><div class="warn">本月記錄英明格使用 ${imigran} 天。Triptan 每月使用達 10 天是藥物過度使用的重要警戒指標；請依醫師處方使用。</div><h3>近六個月頭痛天數</h3><canvas id="chart" height="190" aria-label="近六個月頭痛天數圖"></canvas><p class="muted" style="font-size:12px">統計僅供觀察趨勢，不能單獨用來診斷或建議用藥。</p></section>`}function drawChart(){let c=$('chart');if(!c)return;let ctx=c.getContext('2d'),w=c.width=c.clientWidth*devicePixelRatio,h=c.height=190*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);w=c.clientWidth;h=190;let month=window.statMonth||today().slice(0,7),months=Array.from({length:6},(_,i)=>{let d=new Date(Number(month.slice(0,4)),Number(month.slice(5))-1-(5-i),1);return dateISO(d).slice(0,7)}),counts=months.map(m=>new Set(db.records.filter(r=>r.date.startsWith(m)).map(r=>r.date)).size),max=Math.max(5,...counts),barW=(w-30)/6;ctx.fillStyle='#597084';ctx.font='12px sans-serif';months.forEach((m,i)=>{let bh=counts[i]/max*130,x=16+i*barW,y=148-bh;ctx.fillStyle='#2879bb';ctx.fillRect(x,y,Math.max(12,barW-16),bh);ctx.fillStyle='#4b6176';ctx.fillText(String(counts[i]),x+5,y-5);ctx.fillText(m.slice(5),x+5,171)})}
function settingsHTML(){return `<section class="card"><h2>藥物管理</h2>${db.meds.map(m=>`<div class="entry"><div class="flex"><div><b>${esc(m.name)}</b><div class="muted" style="font-size:13px">${esc(m.strength)} ${esc(m.unit)} · ${m.active?'使用中':'已停用'}</div></div><button class="btn mini" onclick="openMed('${esc(m.id)}')">編輯</button></div></div>`).join('')}<button class="btn primary" onclick="openMed('')">＋ 新增藥物</button></section><section class="card"><h2>醫院與醫師</h2><button class="btn" onclick="go('visitSettings')">管理醫院／醫師清單</button></section><section class="card"><h2>資料備份與還原</h2><p class="muted" style="font-size:13px">資料儲存在目前瀏覽器的本機空間。請定期備份；清除網站資料、換手機或使用無痕模式可能導致資料遺失。</p><div class="actions"><button class="btn primary" onclick="exportJSON()">匯出完整備份 JSON</button><button class="btn" onclick="exportCSV()">匯出頭痛 CSV</button></div><div class="field"><label>匯入備份 JSON（會取代目前全部資料）</label><input type="file" accept="application/json,.json" onchange="importJSON(this.files[0])"></div></section><section class="card"><h2>使用提醒</h2><p class="muted">本工具是個人健康紀錄，不提供診斷或用藥指示。突然出現前所未有的劇烈頭痛、神經功能異常或意識改變時，請立即就醫。</p></section>`}function openMed(id){medEditId=id;window.medDraft=id?structuredClone(db.meds.find(x=>x.id===id)):{id:uid(),name:'',strength:'',unit:'mg',active:true};go('medEdit')}function medHTML(){let m=window.medDraft;return `<section class="card"><div class="flex"><button class="btn mini" onclick="go('settings')">❮ 返回</button><h2>${medEditId?'修改':'新增'}藥物</h2></div><div class="field"><label>藥物名稱</label><input id="med_name" value="${esc(m.name)}" placeholder="藥名"></div><div class="twocol"><div class="field"><label>單位規格</label><input id="med_strength" value="${esc(m.strength)}" placeholder="例如 50"></div><div class="field"><label>單位</label><select id="med_unit">${['mg','g','mL','錠','tablet','其他'].map(x=>`<option ${m.unit===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>狀態</label><select id="med_active"><option value="yes" ${m.active?'selected':''}>使用中</option><option value="no" ${!m.active?'selected':''}>停用（保留歷史紀錄）</option></select></div><button class="btn primary" onclick="saveMed()">儲存藥物</button></section>`}function saveMed(){let m=window.medDraft;Object.assign(m,{name:val('med_name').trim(),strength:val('med_strength').trim(),unit:val('med_unit'),active:val('med_active')==='yes'});if(!m.name){alert('請輸入藥物名稱');return}let i=db.meds.findIndex(x=>x.id===m.id);if(i>=0)db.meds[i]=m;else db.meds.push(m);save();go('settings')}
function visitSettingsHTML(){return `<section class="card"><div class="flex"><button class="btn mini" onclick="go('settings')">❮ 返回</button><h2>醫院與醫師管理</h2></div><h3>醫院</h3>${db.hospitals.map((x,i)=>`<div class="entry flex"><span>${esc(x)}</span><button class="btn mini" onclick="renameOption('hospitals',${i})">修改</button></div>`).join('')}<button class="btn" onclick="newOption('hospitals')">＋ 新增醫院</button><h3>醫師</h3>${db.doctors.map((x,i)=>`<div class="entry flex"><span>${esc(x)}</span><button class="btn mini" onclick="renameOption('doctors',${i})">修改</button></div>`).join('')}<button class="btn" onclick="newOption('doctors')">＋ 新增醫師</button><p class="muted" style="font-size:12px">修改清單名稱不會覆蓋既有就醫紀錄。</p></section>`}function newOption(k){let x=prompt('請輸入'+(k==='hospitals'?'醫院':'醫師')+'名稱');if(x?.trim()&&!db[k].includes(x.trim())){db[k].push(x.trim());save();render()}}function renameOption(k,i){let x=prompt('修改名稱',db[k][i]);if(x?.trim()){db[k][i]=x.trim();save();render()}}
function download(name,data,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type}));a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}function exportJSON(){download('頭痛紀錄完整備份_'+today()+'.json',JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2),'application/json;charset=utf-8')}function exportCSV(){let head=['日期','時間','發作時段','開始性質','疼痛位置','疼痛性質','程度','噁心','怕光','怕噪音','震動加重','工作壓力','用藥摘要','備註'],rows=db.records.map(r=>[r.date,r.time,r.period,r.onset,(r.location||[]).join('、'),r.pain,r.severity,r.nausea,r.light,r.noise,r.movement,r.stress,(r.medEvents||[]).map(e=>`${e.time||''} ${(e.meds||[]).map(id=>{let m=db.meds.find(z=>z.id===id);return m?m.name+' '+m.strength+m.unit:'已刪除藥物'}).join('+')} ${e.relief||''} ${e.minutes||''}分`).join('；'),r.notes]);let csv='\ufeff'+[head,...rows].map(a=>a.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download('頭痛紀錄_'+today()+'.csv',csv,'text/csv;charset=utf-8')}async function importJSON(file){if(!file)return;try{let x=JSON.parse(await file.text());if(!Array.isArray(x.records)||!Array.isArray(x.visits)||!Array.isArray(x.meds))throw Error('格式不正確');if(!confirm(`確定匯入？將以備份的 ${x.records.length} 筆頭痛紀錄取代目前所有資料。`))return;db={...clone(defaults),...x};save();go('calendar');alert('匯入完成')}catch(e){alert('匯入失敗：'+e.message)}}try{render()}catch(err){document.getElementById('app').innerHTML='<section class="card"><h2>App 啟動失敗</h2><p>目前瀏覽環境可能不支援部分功能。請改由 Safari 網址開啟部署版。</p><p style="word-break:break-all">'+esc(err.message)+'</p></section>'}
</script></body></html>
